# ---docerion
# type: config
# title: Ruff lint and format settings for content
# summary: Configures Ruff line length, indentation, exclusions and lint rules for Python code in the content module.
# ---

line-length = 80
indent-width = 2
extend-exclude = [
  "*_pb2.py",
  "third_party/*",
]

[lint]
unfixable = ["F401"]

[format]
quote-style = "preserve"
