title: Body overflow hidden with blocking touch handlers test page
summary: Test page like body_overflow_hidden.html but with non-passive touch handlers that can block scrolling.
-->

<html>
<head>
  <meta name='viewport' content='width=device-width, minimum-scale=1'>
</head>
<style>
body {
  height: 10000px;
  overflow: hidden;
}
</style>
<div style="width:100px; height:300px; overflow: scroll;">
  <div style="width:150px; height:250px; overflow: scroll">
    <div style="width:300px; height:200px; overflow: scroll">
    </div>
  </div>
</div>
<script>
  document.addEventListener('touchstart', (e) => {}, {passive: false});
  document.addEventListener('touchmove', (e) => {}, {passive: false});
</script>
</html>
