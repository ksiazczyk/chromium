<!--docerion
type: test
title: Page with touch start janking main thread
summary: Test page that blocks the main thread for roughly 1.2 seconds inside a non-passive touchstart handler to simulate jank during touch input.
-->

<html>
<style>
#janktest{
  width: 1000px;
  height: 10000px;
}
</style>
<body onload='setup()'>
 <div id="janktest"></div>
</body>
<script>
function setup() {
  document.getElementById('janktest').addEventListener('touchstart', (e) => {
    var end = performance.now() + 1200;
    while (performance.now() < end);
  }, {passive: false});
}
</script>
</html>
