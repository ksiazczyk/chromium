<!--docerion
type: test
title: Frame tree test page 2-1 with postMessage handler
summary: Test fixture frame that listens for postMessage events, replies to the sender, and sets the top document title when it receives 'msg4'.
-->

<html>
<head>
<script>
window.addEventListener("message", messageReceived, false);

function messageReceived(event) {
  if (event.data === 'msg4') {
    window.top.document.title = event.data;
  } else {
    event.source.postMessage("2-1-reply", "*");
  }
}
</script>
</head>
<body>

Frame 2-1.
<br>

</body>
</html>
