type: test
title: Remove object element with invalid data
summary: Test page that on load removes a div containing an object element with invalid data.
-->

<html>
<head>
<script>

function DoLoad() {
  let test_div = document.getElementById("test_div");
  document.body.removeChild(test_div);
}

</script>
</head>
<body onload="DoLoad();">
<div id="test_div">
  <object data="INVALID"></object>
</div>
</body>
</html>
