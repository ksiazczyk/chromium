<!--docerion
type: test
title: Request MIDI sysex access test page
summary: HTML test page that requests MIDI access with sysex enabled and sets the document title to pass or fail depending on the result.
-->

<html>
<script>
var error_message = "";
navigator.requestMIDIAccess({sysex: true}).then(
  _ => { document.title = "pass" },
  e => {
    error_message = e.message;
    document.title = "fail";
  });
</script>
</html>
