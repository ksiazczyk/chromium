<html>
<head></head>
<script>
const worker = new Worker('/back_forward_cache/worker.js');
window.receivedMessagePromise = new Promise(resolve => {
  worker.addEventListener('message', (msg) => {
    resolve(msg.data);
  });
});
</script>
</html>
