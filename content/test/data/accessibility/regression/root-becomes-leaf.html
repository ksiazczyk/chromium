<!--docerion
type: test
title: Root becomes leaf regression test
summary: Accessibility regression test page that sets aria-hidden on a container so the accessibility tree root becomes a leaf, guarding against a crash.
-->

<!--
@WAIT-FOR:done
-->
<body>
<div id="container"></div>
<script>
  function crash() {
    document.getElementById('container').setAttribute('aria-hidden', 'true');
    setTimeout(() => {
      document.title = 'done';
    }, 100);
  }
  setTimeout(crash, 100);
</script>
