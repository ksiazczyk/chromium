type: test
title: Compute name while freezing regression test
summary: HTML regression test that computes the accessible name and role of a select element labeled from inside a video element.
-->

<!--
@WAIT-FOR:done
-->
<select id="select1"></select>
<video>
  <label for="select1"></label>
</video>
<script>
function getName() {
  document.querySelector('#select1').computedName;
  document.querySelector('#select1').computedRole;
  document.title = 'done';
}
document.addEventListener('DOMContentLoaded', getName);
</script>
