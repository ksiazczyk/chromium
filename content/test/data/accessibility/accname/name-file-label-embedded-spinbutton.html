<!doctype html>
<html>
<body>
<input type="file" id="test" />
<label for="test">
  foo
  <input role="spinbutton"
	 type="number"
	 value="5"
	 min="1"
	 max="10"
	 aria-valuenow="5"
	 aria-valuemin="1"
	 aria-valuemax="10">
  baz
</label>
</body>
</html>
