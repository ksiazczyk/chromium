<!doctype html>
<html>
<body>
<style type="text/css">
  label:before { content: "foo"; }
  label:after { content: "baz"; }
</style>
<label for="test">
<input id="test" type="image" src="foo.jpg" name="test" title="bar">
</label>
</body>
</html>
