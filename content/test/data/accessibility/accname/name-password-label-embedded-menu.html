summary: HTML test page for accessible name computation of a password input whose label embeds a menu with menuitem children.
-->

-->
<!doctype html>
<html>
<body>
<input type="password" id="test" />
<label for="test">Flash the screen
  <span role="menu">
    <span role="menuitem" aria-selected="true">1</span>
    <span role="menuitem" hidden>2</span>
    <span role="menuitem" hidden>3</span>
  </span>
  times.
</label>
</body>
</html>
