summary: HTML test page checking that CSS ::before and ::after generated content contributes to an input's accessible name via aria-labelledby.

<!doctype html>
<html>
<body>
<style type="text/css">
  p::before { content: "one"; }
  p::after { content: "three"; }
</style>
<input id="test" type="text" aria-labelledby="ID1 ID2">
<p id="ID1">two</p>
<p id="ID2" hidden>four</p>
</body>
</html>
