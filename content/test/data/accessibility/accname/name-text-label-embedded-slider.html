title: 'Accessible name test: text input label with embedded slider'
summary: HTML test page verifying accessible name computation for a text input whose label embeds a slider role input.
-->

<!--

<!doctype html>
<html>
<body>
<input type="text" id="test" />
<label for="test">foo
<input role="slider"
       type="range"
       value="5"
       min="1"
       max="10"
       aria-valuenow="5"
       aria-valuemin="1"
       aria-valuemax="10"> baz
</label>
</body>
</html>
