summary: HTML test page with a checkbox whose label embeds a listbox, used to verify accessible name computation for embedded listbox roles.
-->

<!doctype html>
<html>
<body>
<input type="checkbox" id="test" />
<label for="test">Flash the screen
  <ul role="listbox" style="list-style-type: none;">
    <li role="option" aria-selected="true">1</li>
    <li role="option">2</li>
    <li role="option">3</li>
  </ul>
  times.
</label>
</body>
</html>
