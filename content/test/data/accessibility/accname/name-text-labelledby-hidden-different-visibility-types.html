<!DOCTYPE html>
<html>
<body>
  <input id="test" aria-labelledby="t1">
  <div id="t1" style="visibility:hidden">
    <span aria-hidden="true">a</span>
    <span style="display:none">b</span>
    <span style="visibility:hidden">c</span>
    <span>d</span>
    e
  </div>
</body>
</html>
