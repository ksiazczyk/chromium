summary: HTML test page checking how a file input's accessible name is computed from a label containing embedded menu items.
-->

<!doctype html>
<html>
<body>
<input type="file" id="test" />
<label for="test">Flash the screen
  <span role="menu">
    <span role="menuitem" aria-selected="true">1</span>
    <span role="menuitem" hidden>2</span>
    <span role="menuitem" hidden>3</span>
  </span>
  times.
</label>
</body>
</html>
