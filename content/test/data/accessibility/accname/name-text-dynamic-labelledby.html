<!--docerion
type: test
title: HTML test page for dynamically applied aria-labelledby
summary: HTML test page that sets aria-labelledby on an input after page load so its accessible name is computed dynamically from the labelled element.
-->

<!--
@BLINK-DENY:description
@WAIT-FOR:done
-->
<!DOCTYPE html>
<html>
<body>
  <input id="test">
  <div id="t1">foo</div>
</body>
</html>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      document.querySelector('#test').setAttribute("aria-labelledby", "t1");
      document.title='done';
    }, 50);
  });
</script>
