<!doctype html>
<html>
<body>
<input type="file" id="test" />
<label for="test">Flash the screen
  <div role="combobox">
    <div role="textbox"></div>
    <ul role="listbox" style="list-style-type: none;">
      <li role="option" aria-selected="true">1</li>
      <li role="option">2</li>
      <li role="option">3</li>
    </ul>
  </div>
  times.
</label>
</body>
</html>
