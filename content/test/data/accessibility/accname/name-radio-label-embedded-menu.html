summary: HTML test case computing the accessible name of a radio whose label embeds a menu with a selected menu item.
-->

<!--

<!doctype html>
<html>
<body>
<input type="radio" id="test" />
<label for="test">Flash the screen
  <span role="menu">
    <span role="menuitem" aria-selected="true">1</span>
    <span role="menuitem" hidden>2</span>
    <span role="menuitem" hidden>3</span>
  </span>
  times.
</label>
</body>
</html>
