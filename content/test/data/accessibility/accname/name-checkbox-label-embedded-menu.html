type: test
title: Checkbox with embedded menu in label accname test
summary: HTML test page with a checkbox whose label embeds a menu with hidden items, used to verify accessible name computation for embedded menu roles.
-->

<!--
@BLINK-DENY:descri*
-->
<!doctype html>
<html>
<body>
<input type="checkbox" id="test" />
<label for="test">Flash the screen
  <span role="menu">
    <span role="menuitem" aria-selected="true">1</span>
    <span role="menuitem" hidden>2</span>
    <span role="menuitem" hidden>3</span>
  </span>
  times.
</label>
</body>
</html>
