type: test
title: select-slowly-build accessibility test page
summary: HTML test page that asynchronously adds an option to a select and a Done marker after several animation frames, for testing incremental accessibility tree updates.
-->

<!--
@WAIT-FOR:Done
-->
<!DOCTYPE html>
<select></select>
<script>
(async () => {
  await new Promise(requestAnimationFrame);
  await new Promise(requestAnimationFrame);
  await new Promise(requestAnimationFrame);
  const select = document.querySelector('select');
  const option = document.createElement('option');
  option.textContent = 'option';
  select.appendChild(option);

  const div = document.createElement('div');
  div.textContent = 'Done';
  document.body.appendChild(div);
})();
</script>
