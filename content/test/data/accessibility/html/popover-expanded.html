<!--docerion
type: test
title: Popover expanded accessibility test page
summary: HTML test page that clicks a button to expand a popover and waits for the accessibility tree to reflect the expanded state.
-->

<!DOCTYPE html>

<button id=toggle popovertarget="will-expand">Will expand</button>
<div popover id="will-expand">PopoverIsExpanded</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('toggle').click();
});
</script>
