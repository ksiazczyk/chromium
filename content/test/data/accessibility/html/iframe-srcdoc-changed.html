<!--docerion
type: test
title: iframe-srcdoc-changed accessibility test page
summary: HTML test page that creates an iframe with srcdoc content, updates the srcdoc, and signals completion by setting the document title to done.
-->

<!--
@WIN-ALLOW:ia2_hypertext=*
@WAIT-FOR:done
-->
<body>
</body>
<script>
  const iframe = document.createElement('iframe');
  iframe.onload = () => {
    iframe.onload = () => {
      setTimeout(() => { document.title = 'done' }, 99);
    };
    iframe.srcdoc = '';
  };
  iframe.srcdoc = '<a href="/">link inside iframe</a>';
  document.body.appendChild(iframe);
</script>
