<!DOCTYPE html>
<html>
<body>
  <!-- Focusable parent (tabindex="0") with role="group" with image child with alt text property. -->
  <div tabindex="0" role="group">
    Text before Green Box
    <img src="greenbox.png" alt="green box">
    Text after Green Box
  </div>
</body>
</html>
