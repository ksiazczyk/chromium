<!DOCTYPE html>
<html>
  <body>
    <label>Email: <input type="email" placeholder="email@example.com"></label>
    <label>Number: <input type="number" placeholder="3"></label>
    <label>Password: <input type="password" placeholder="pwd"></label>
    <label>Search: <input type="search" placeholder="search"></label>
    <label>Tel: <input type="tel" placeholder="555-1212"></label>
    <label>Text: <input type="text" placeholder="just text"></label>
    <label>Url: <input type="url" placeholder="https://www.example.com"></label>
  </body>
</html>
