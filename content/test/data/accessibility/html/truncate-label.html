<!--docerion
type: test
title: Huge aria-label truncation test page
summary: HTML test page that sets a one-million-character aria-label on a group element via script to test truncation of very long accessibility names.
-->

<!--
@BLINK-ALLOW:name=*
-->
<!DOCTYPE html>
<html>
<body>
<div role="group" id="big"></div>
<script>
  var huge = document.getElementById('big');
  var count = 1000000;
  var bigStr = '';
  for (var i = 0; i < count; i++)
    bigStr += 'x';
  huge.setAttribute('aria-label', bigStr);
</script>
</body>
</html>
