<button id="button1" disabled>old<div></div></button>
<script>
function update() {
  document.getElementById("button1").childNodes[0].textContent = "new";
  document.title="done";
}
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(update, 0);
});
</script>
