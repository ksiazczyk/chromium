<!DOCTYPE html>
<button id="btn" commandfor="menu" command="toggle-popover">Implicit Button Name</button>
<menulist id="menu" aria-label="Aria Label Name">

</menulist>
<script>
  window.addEventListener('load', () => {
    btn.click();
  });
</script>
