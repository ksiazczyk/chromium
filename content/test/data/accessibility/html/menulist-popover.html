summary: HTML test page opening a menulist popover with Copy and Paste items via a popovertarget button to verify its accessibility tree.
-->

<!--

@AURALINUX-ALLOW:setsize*
@AURALINUX-ALLOW:posinset*
-->
<!DOCTYPE html>
<button id="button" popovertarget="menu">Show Menu</button>
<menulist id="menu" popover>
  <menuitem>Copy</menuitem>
  <menuitem>Paste</menuitem>
</menulist>
<script>
  window.addEventListener('load', () => {
    button.click();
  });
</script>
