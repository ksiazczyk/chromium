<!DOCTYPE html>
<button id="btn1" commandfor="menu" command="toggle-popover">Button 1</button>
<button id="btn2" commandfor="menu" command="toggle-popover">Button 2</button>
<menulist id="menu">
  <menuitem>Item 1</menuitem>
</menulist>
<script>
  window.addEventListener('load', () => {
    btn2.click();
  });
</script>
