<!DOCTYPE html>
<html>
<body>
<div id="slider" role="slider" aria-valuenow="1" aria-valuetext="1%"
     aria-orientation="vertical">
</div>
<script>
  function go() {
    document.getElementById('slider').setAttribute('aria-valuetext', '2%');
  }
</script>
</body>
</html>
