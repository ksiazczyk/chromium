<!DOCTYPE html>
<html>
<body>
<select aria-label="Fruit" autofocus>
  <option selected>Apple</option>
  <option>Orange</option>
  <option>Banana</option>
</select>
<script>
function go() {
  document.querySelector('select').selectedIndex = 1;
}
</script>
</body>
</html>
