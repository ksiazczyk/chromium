<!DOCTYPE html>
<html>
<body>
<button id="btn" aria-haspopup="menu" aria-pressed="false" aria-label="Menu Button">Menu</button>
<script>
  function go() {
    document.getElementById('btn').setAttribute('aria-pressed', 'true');
  }
</script>
</body>
</html>
