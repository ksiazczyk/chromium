<!DOCTYPE html>
<html>
<body>
<div id="slider" role="slider" aria-valuenow="1">
</div>
<script>
  function go() {
    document.getElementById('slider').setAttribute('aria-valuenow', '2');
  }
</script>
</body>
</html>
