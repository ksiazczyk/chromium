type: test
title: Pseudo-element check-mark override content test page
summary: HTML test page that overrides the option check-mark content in a customizable select for accessibility tree verification.
-->

<!--
@DEFAULT-ACTION-ON:Pets
-->
<!DOCTYPE html>
<html>
<head>
<style>
  select,
  select::picker(select) {
    appearance: base-select;
  }

  option::checkmark {
    content: '>';
  }
</style>
</head>
<body>
  <select aria-label="Pets">
    <option>Dog</option>
    <option>Cat</option>
    <option>Donkey</option>
  </select>
</body>
</html>
