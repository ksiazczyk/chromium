<!--docerion
type: test
title: Visibility to visible accessibility test page
summary: HTML test page that switches two elements from hidden to visible visibility via a timeout and marks completion by updating the code element.
-->

<!--
@WAIT-FOR:done
-->
<div>
  Cats
  <span id="visible" style="visibility:hidden;">
      <input type="checkbox" aria-label="checkbox">
  </span>
  <div><code>pending</code></div>
</div>
<div role="group" id="visible2" style='visibility: hidden'><mark>text</mark></div>

<script>
  setTimeout(()=> {
    document.getElementById('visible').style.visibility = 'visible';
    document.getElementById('visible2').style.visibility = 'visible';
    document.querySelector('code').innerText = 'done';
  }, 200);
</script>
