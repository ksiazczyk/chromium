type: test
title: Pseudo-element alternative text test page
summary: HTML test page applying alternative text to ::before and ::after pseudo-element images via the content property, for accessibility tree verification.
-->

<!--
-->
<!DOCTYPE html>
<html>
<head>
  <style>
    #parent::before {
      content: url(bullet.png) / "alternative text";
    }
    #parent::after {
      content: url(bullet.png) / "";
    }
  </style>
</head>
<body>
  <div id="parent">
    <span class="before">DOM text</span>
  </div>
</body>
</html>
