<!--docerion
type: test
title: Inline position relative accessibility test page
summary: Test page using an inline-block spacer and a position:relative span to check page locations of inline text in the accessibility tree.
-->

<!--
@BLINK-ALLOW:pageLocation*
@BLINK-ALLOW:htmlTag*
-->
<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      padding: 0;
      margin: 0;
    }
    .before {
      display: inline-block;
      width: 100px;
    }
    .after {
      position: relative;
    }
  </style>
</head>
<body>
  <div>
    <span class="before">Before</span><span class="after">After</span>
  </div>
</body>
</html>
