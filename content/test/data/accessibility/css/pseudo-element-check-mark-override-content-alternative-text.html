<!--docerion
type: test
title: Check-mark override content alternative text test page
summary: HTML test page styling option::checkmark with content '>' and the alternative text 'a right pointing chevron' in a customizable select, for accessibility verification.
-->

<!--
@DEFAULT-ACTION-ON:Pets
-->
<!DOCTYPE html>
<html>
<head>
<style>
  select,
  select::picker(select) {
    appearance: base-select;
  }

  option::checkmark {
    content: '>' / 'a right pointing chevron';
  }
</style>
</head>
<body>
  <select aria-label="Pets">
    <option>Dog</option>
    <option>Cat</option>
    <option>Donkey</option>
  </select>
</body>
</html>
