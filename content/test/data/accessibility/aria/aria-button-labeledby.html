type: test
title: ARIA button labelledby accessibility test page
summary: HTML test page with a button whose accessible name comes from aria-labelledby pointing at a label element.
-->

<!--
@MAC-ALLOW:AXRoleDescription
-->
<!DOCTYPE html>
<html>
  <body>
    <label
      for="downshift-0-input"
      id="downshift-0-label"
      aria-label="How are you?"
      >How are you?</label
    >
    <button
      aria-labelledby="downshift-0-label"
      id="downshift-0-input"
      type="button"
    >
      Select Option
    </button>
  </body>
</html>
