<!--docerion
type: test
title: aria-details reference target accessibility test page
summary: Accessibility test page using shadowrootreferencetarget to expose aria-details targets for a text group and an image.
-->

<!--
@BLINK-ALLOW:details*
-->
<!DOCTYPE html>
<html>
  <body>
    <p>This <span aria-details="details details2">text</span> has details</p>
    <x-description id="details">
      <template shadowrootmode="open" shadowrootreferencetarget="target">
        <div role="group" id="target">Text details</div>
      </template>
    </x-description>
    <x-description id="details2">
      <template shadowrootmode="open" shadowrootreferencetarget="target">
        <img id="target" alt="Image details">
      </template>
    </x-description>
  </body>
</html>
