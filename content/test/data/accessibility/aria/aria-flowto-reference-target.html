<html>
  <body>
    <section aria-flowto="next" aria-label="current">Lorem ipsum</section>
    <x-footer id="next">
      <template shadowrootmode="open" shadowrootreferencetarget="target">
        <footer id="target" aria-label="next">dolor sit amet</footer>    
      </template>
    </x-footer>
  </body>
</html>
