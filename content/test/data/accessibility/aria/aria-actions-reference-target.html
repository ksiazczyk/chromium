<!--docerion
type: test
title: ARIA actions reference target test page
summary: Test page with a textbox host whose aria-actions relation points to a button inside a shadow DOM via a reference target.
-->

<!--
@BLINK-ALLOW:actions*
@MAC-ALLOW:AXCustomActionNamesForTesting
-->
<!DOCTYPE html>
<html>
<body>
  <div role="textbox" id="my-textbox" aria-actions="edit">
    your-file-name.pdf
    <x-div id="edit">
      <template shadowrootmode="open" shadowrootreferencetarget="target">
        <button id="target">Edit</button>
      </template>
    </x-div>
  </div>
</body>
</html>
