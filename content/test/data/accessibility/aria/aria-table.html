<!DOCTYPE html>
<html>
<body>
<div role="table">
  <div role="row">
    <span role="columnheader">Browser</span>
    <span role="columnheader">Rendering Engine</span>
  </div>
  <div role="row">
    <span role="cell">Chrome</span>
    <span role="cell">Blink</span>
  </div>
</div>
</body>
</html>
