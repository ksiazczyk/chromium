<!--docerion
type: test
title: Role change delay accessibility test page
summary: Accessibility test page that sets a tablist role on a div after a delay and signals completion via the document title for waiting tests.
-->

<!--
@WAIT-FOR:done
-->
<div id="tablist">tab list</div>
<script>
setTimeout(() => {
  document.querySelector('#tablist').setAttribute('role', 'tablist');
  setTimeout(() => {
    document.title = 'done';
  }, 50);
}, 50);
</script>
