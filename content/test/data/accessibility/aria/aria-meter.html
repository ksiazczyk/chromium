<!--docerion
type: test
title: aria-meter accessibility test page
summary: HTML test page with two meter roles exercising aria value attributes such as aria-valuemin, aria-valuemax, aria-valuenow and aria-valuetext.
-->

<html>
  <body>
    <div role="meter"
	 aria-label="funding"
	 aria-valuemin="0"
	 aria-valuemax="100"
	 aria-valuenow="50"
	 aria-valuetext="half-way">
      We're getting there!
    </div>
    <div role="meter"
	 aria-label="funding"
	 aria-valuemin="0"
	 aria-valuemax="100"
	 aria-valuenow="10">
      Not so great.
    </div>
  </body>
</html>
