<!DOCTYPE html>
<html>
<body>
  <div role="heading" aria-label="Foo" aria-level="1">
    <p>bar</p>
    <p>baz</p>
  </div>
  <h1 aria-label="foo">
    <p>bar</p>
    <p>baz</p>
  </h1>
  <h1 aria-label="Section">
    <a href="#">Read More</a>
  </h1>
</body>
