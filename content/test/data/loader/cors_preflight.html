type: test
title: CORS preflight fetch test page
summary: Test page that performs a fetch with a custom header and cache mode from query parameters to trigger CORS preflight, setting the title to DONE.
-->

<html>
<head>
<script>
const cors_url = location.protocol + "//" + location.hostname + ":" +
    location.search.split(';')[1];
const cache_mode = location.search.split(';')[2];
fetch(cors_url, {cache: cache_mode, headers: [["foo", "bar"]]}).then(() => {
  document.title = "DONE";
});
</script>
</head>
</html>
