type: test
title: Inject srcdoc iframe with nested frame test page
summary: Test page that injects a srcdoc iframe containing a nested form iframe into a div, for navigation controller testing.
-->

<html>
<head></head>
<body>
  <p>This page injects a srcdoc frame with a nested form iframe.
  <div id="myDiv"></div>
  <script>
    var iframeHtml =
        '<iframe srcdoc="<iframe src=\'form.html\'><\/iframe>"><\/iframe>';

    // Create an iframe srcdoc with nested frame inside the preexisting div.
    document.getElementById('myDiv').innerHTML = iframeHtml;
  </script>
</body>
</html>
