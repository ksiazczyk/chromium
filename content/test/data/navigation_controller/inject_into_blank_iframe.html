<html>
<head></head>
<body>
  <p>This page injects content into its blank iframe.
  <p><iframe id="frame1"></iframe>
  <script>
    var f = document.getElementById("frame1");
    f.contentDocument.body.innerHTML = "Injected text";
  </script>
</body>
</html>
