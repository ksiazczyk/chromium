summary: Test page that injects an iframe pointing to a cross-site form page via innerHTML, for navigation controller testing.

<html>
<head></head>
<body>
  <p>This page injects a cross-site iframe.</p>
  <div id="myDiv"></div>
  <script>
    var iframeHtml =
        '<iframe id="frame" src="/cross-site/foo.com/navigation_controller/form.html"></iframe>';

    document.getElementById('myDiv').innerHTML = iframeHtml;
  </script>
</body>
</html>
