title: Beforeunload dialog test page
summary: Test page that registers a beforeunload handler which shows an alert via setTimeout, for testing dialogs during unload.
-->

<html>
<head>
<script>
window.addEventListener("beforeunload", function (event) {
  setTimeout(function() {
    window.alert("hi");
  }, 0);
});
</script>
</head>
<body>
</body>
</html>
