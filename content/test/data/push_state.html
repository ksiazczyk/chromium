type: test
title: History pushState test page
summary: 'Pushes a #pushState entry onto the history stack on load and updates the document title for navigation tests.'
-->

<html>
<head>
<script>
window.onload = function() {
  setTimeout(function() {
    history.pushState("", "", "#pushState");
    document.title = "pushState";
  }, 0);
}
</script>
</head>
</html>
