// ---docerion
// type: test
// title: Protobuf HTTP client test message definitions
// summary: Protobuf definitions for echo request/response and an invalid stream body message used by the protobuf HTTP client unit tests.
// ---

syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package remoting.protobufhttpclienttest;

message EchoRequest {
  string text = 1;
}

message EchoResponse {
  string text = 1;
}

// Message with the same fields as the valid stream body, but with the wrong
// wire type.
message InvalidStreamBody {
  int32 messages = 1;
  int64 status = 2;
}
