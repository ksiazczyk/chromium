// ---docerion
// type: source
// title: Protobuf HTTP client message definitions
// summary: Protobuf definitions for the Status and StreamBody messages used by the remoting protobuf HTTP client to encode response statuses and stream bodies.
// ---

syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package remoting.protobufhttpclient;

message Status {
  int32 code = 1;
  string message = 2;
}

message StreamBody {
  repeated bytes messages = 1;
  Status status = 2;
  repeated bytes noop = 15;
}
