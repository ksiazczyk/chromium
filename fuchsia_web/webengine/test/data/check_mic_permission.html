<!--docerion
type: test
title: Microphone permission test page
summary: Test page that queries the microphone permission state on load and reports it via the document title.
-->

<html>
  <body>
    <video></video>
    <script>
      window.onload = () => {
        navigator.permissions.query({name: 'microphone'}).then(r => {
          document.title = r.state;
        });
      }
    </script>
  </body>
</html>
