<!--docerion
type: test
title: Custom header request test page
summary: Test page that sends an XMLHttpRequest to image.html with a Test request header set by JavaScript.
-->

<html>
  <head></head>
  <body>
    <script>
      // Start a request with the Test header set.
      var req = new XMLHttpRequest();
      req.onload = function() {
        document.title = 'loaded';
      };
      req.open('GET', './image.html');
      req.setRequestHeader('Test', 'SetByJS');
      req.send();
    </script>
  </body>
</html>
