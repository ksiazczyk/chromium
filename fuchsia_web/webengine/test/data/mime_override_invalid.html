<!--docerion
type: test
title: Invalid MIME override test page
summary: Test page that fetches its own URL over XHR and reports the response content-type header via the document title.
-->

<html>
  <head></head>
  <body>
    <script>
      // Emit the "content-type" header for this file.
      var req = new XMLHttpRequest();
      req.open('GET', 'mime_override_invalid.html', false);
      req.send(null);
      var headers = req.getAllResponseHeaders();
      for (var header of headers.split('\n')) {
        if (header.includes('content-type:'))
          document.title = header;
      }
    </script>
  </body>
</html>
