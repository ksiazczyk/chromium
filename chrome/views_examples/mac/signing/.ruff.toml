# ---docerion
# type: config
# title: Ruff configuration for Views Examples Mac signing
# summary: Sets Ruff lint and formatting options for this directory, matching the style of the Chrome installer Mac signing package it extends.
# ---

# The files in this directory are copied into, and extend, the Python package
# from //chrome/installer/mac/signing, so keep the same formatting as
# //chrome/installer/mac/.ruff.toml rather than the //chrome default.
line-length = 80
indent-width = 4

[format]
quote-style = "preserve"
