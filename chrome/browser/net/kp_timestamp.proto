// ---docerion
// type: source
// title: Key pinning timestamp protobuf message
// summary: Defines the KPTimestamp protobuf message holding seconds and nanos used for key pinning list timestamps.
// ---

syntax = "proto3";

package chrome_browser_key_pinning;

option optimize_for = LITE_RUNTIME;

message KPTimestamp {
  int64 seconds = 1;

  int32 nanos = 2;
}