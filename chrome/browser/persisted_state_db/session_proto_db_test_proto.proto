// type: source
// title: SessionProtoDBTestProto test protobuf definition
// summary: Defines a proto2 message with key and int32 fields that is used for testing the session proto database.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package profile_proto_db;

// Proto used for testing purposes.
message SessionProtoDBTestProto {
  // A field
  optional string key = 1;

  // Another field
  optional int32 b = 2;
}
