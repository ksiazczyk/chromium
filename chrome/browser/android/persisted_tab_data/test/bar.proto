// ---docerion
// type: test
// title: BarData protobuf definition for persisted tab data tests
// summary: Defines the BarData protobuf message with a boolean value used to serialize BarPersistedTabDataAndroid in tests.
// ---

syntax = "proto2";

package ptd;

option java_package = "org.chromium.chrome.browser.persisted_tab_data";

option optimize_for = LITE_RUNTIME;

message BarData {
  optional bool value = 1;
}
