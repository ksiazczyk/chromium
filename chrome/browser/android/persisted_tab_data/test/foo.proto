// ---docerion
// type: test
// title: FooData protobuf definition for persisted tab data tests
// summary: Defines the FooData protobuf message with an int32 value used to serialize FooPersistedTabDataAndroid in tests.
// ---

syntax = "proto2";

package ptd;

option java_package = "org.chromium.chrome.browser.persisted_tab_data";

option optimize_for = LITE_RUNTIME;

message FooData {
  optional int32 value = 1;
}
