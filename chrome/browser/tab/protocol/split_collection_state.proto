// ---docerion
// type: source
// title: 'split_collection_state.proto: SplitCollectionState message'
// summary: Defines the SplitCollectionState message storing split tab ID, layout, and split ratio for tab persistence.
// ---

syntax = "proto2";
option optimize_for = LITE_RUNTIME;

package tabs_pb;
option java_package = "org.chromium.chrome.browser.tabs.proto";

message SplitCollectionState {
  optional fixed64 split_tab_id_high = 1;
  optional fixed64 split_tab_id_low = 2;
  optional int32 split_layout = 3;
  optional float split_ratio = 4;
}
