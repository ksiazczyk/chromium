<!--docerion
type: source
title: Entry page for the Indigo WebUI
summary: HTML page that loads the app module and hosts the indigo-image-replacement-app element with the watermark flag from i18n.
-->

<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
<head>
  <meta charset="utf-8">
  <title>$i18n{indigoTitle}</title>
  <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script type="module" src="app.js"></script>
  <indigo-image-replacement-app show-watermark="$i18n{watermarkEnabled}">
  </indigo-image-replacement-app>
</body>
</html>
