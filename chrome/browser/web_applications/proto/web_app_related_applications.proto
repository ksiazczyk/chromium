// ---docerion
// type: source
// title: 'web_app_related_applications.proto: related applications proto'
// summary: Defines the RelatedApplications protobuf mirroring the related applications manifest field with platform, URL and id entries.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package web_app.proto;

// This message should be synced with
// third_party/blink/public/common/manifest/manifest.h
message RelatedApplications {
  optional string platform = 1;
  optional string url = 2;  // Required.
  optional string id = 3;
}
