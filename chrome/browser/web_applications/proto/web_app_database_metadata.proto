// ---docerion
// type: source
// title: 'web_app_database_metadata.proto: database version metadata'
// summary: Defines the DatabaseMetadata message that stores the web app database version to support migrations and non-app storage.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package web_app.proto;

// Stores metadata about the database to enable non-app storage and operations
// like migrations.
message DatabaseMetadata {
  optional int32 version = 1;
}
