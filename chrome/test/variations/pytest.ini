# ---docerion
# type: config
# title: Pytest configuration for variations tests
# summary: Configures pytest for the variations tests, putting the source root on the python path and setting the test file pattern.
# ---

[pytest]
pythonpath=../../../

filterwarnings =
    # ignore warnings about re-imported modules.
    ignore::pytest.PytestAssertRewriteWarning

python_files=*_test.py
