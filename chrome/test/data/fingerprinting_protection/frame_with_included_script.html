<!--docerion
type: test
title: Test frame loading an included script
summary: Test frame that document.writes a script tag defaulting to the included script fixture, with the script URL configurable through a query parameter.
-->

<html>
  <head>
    <!-- Disable extra network request for /favicon.ico -->
    <link rel="icon" href="data:,">
    <script>
      const params = new URLSearchParams(window.location.search);
      const scriptUrl = params.get('script_url') || 'included_script.js';
      document.write(`<script src="${scriptUrl}"><\/script>`);
    </script>
  </head>
</html>
