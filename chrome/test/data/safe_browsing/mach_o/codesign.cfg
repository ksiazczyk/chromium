# ---docerion
# type: config
# title: OpenSSL config for the untrusted code signing certificate
# summary: OpenSSL configuration defining the distinguished name and code signing extensions for the untrusted test certificate.
# ---

[ ca ]
default_ca = CA_default

[ CA_default ]
default_md = sha256
copy_extensions = copy
x509_extensions = req_attrs

[ req ]
distinguished_name = req_distinguished_name
prompt = no
req_extensions = req_attrs
default_md = sha256

[ req_distinguished_name ]
countryName = US
commonName = untrusted@goat.local
localityName = New York
stateOrProvinceName = New York
organizationName = Untrusted Goat

[ req_attrs ]
extendedKeyUsage = codeSigning
keyUsage = digitalSignature
