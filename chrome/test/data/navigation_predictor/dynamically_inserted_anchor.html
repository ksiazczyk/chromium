<!--docerion
type: test
title: Page with dynamically inserted anchor
summary: Test fixture whose script inserts a new anchor into the body after 10 milliseconds, for navigation predictor tests.
-->

<html>
  <head></head>
  <body>
    <script>
      setTimeout(() => {
        const a = document.createElement('a');
        a.href = 'foo';
        a.text = 'bar';
        document.body.appendChild(a);
      }, 10);
    </script>
  </body>
</html>
