<html>
  <title>PrintToPdf CSS Size Test</title>
  <style>
    @page small {
      size: 3in 5in;
    }
    div {
      page: small;
    }
  </style>

  <body>
    <div>This is printed on a small page.</div>
  </body>

</html>
