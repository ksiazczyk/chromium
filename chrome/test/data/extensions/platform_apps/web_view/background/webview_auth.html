<!--docerion
type: test
title: Webview auth request helper page
summary: Helper HTML page that sends an XHR to a URL received via postMessage, used to exercise webview auth request handling.
-->

<!doctype html>
<script>
window.onmessage = function(e) {
  if (e.data.request == 'xhr') {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', e.data.url);
    xhr.send();
  }
};
</script>
