<!--docerion
type: test
title: Page that writes a test cookie
summary: Standalone page that writes the testCookie=1 cookie so tests can verify webviews do not see browser tab cookies.
-->

<!DOCTYPE html>
<html>
  <head>
  </head>
  <body>
    <p> This document writes the following cookie: 'testCookie=1' </p>
  </body>
  <script>
var expire = new Date();
expire.setDate(expire.getDate() + 1);
document.cookie = 'testCookie=1;path=/;expire=' + expire + ';';
  </script>

</html>
