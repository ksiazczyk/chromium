type: test
title: Webview add/remove test guest page
summary: Guest page loaded inside the webview that logs message events and replies with a postMessage so the embedder can verify the connection.

<html>
<head>
</head>
<body>
Add remove webview test guest.

<script>
window.addEventListener('message', function(e) {
  window.console.log('post message received.');
  e.source.postMessage('connected', '*');
});
</script>
</body>
</html>
