<!--docerion
type: test
title: Accessibility Focus Test Page
summary: HTML fixture with a button that repositions a div, used by Chrome extension automation tests for accessibility focus behavior.
-->

<html>
<body>
  <div style="position: absolute; top: 0; left: 0;">
    <p>Text</p>
  </div>
  <button>Move</button>

  <script>
    document.querySelector('button').addEventListener('click', function () {
      document.querySelector('div').style.left = 100;
    });
  </script>
</body>
</html>
