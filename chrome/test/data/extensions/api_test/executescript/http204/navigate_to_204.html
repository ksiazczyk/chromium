<!--docerion
type: test
title: Page that navigates to a HTTP 204 response
summary: Test page whose onload handler navigates the frame to a URL replying with 204 No Content, optionally overriding the target host via the query string.
-->

<!-- html tag = document_start script -->
<html>
<body>
<script>
  window.onload = function() {
    // Navigate to a page that replies with 204 No Content.
    var a = document.createElement('a');
    a.href = '../../../../page204.html';
    if (location.search) {
      a.hostname = location.search.slice(1);
    }
    location.href = a.href;
  }
</script>
</body>
</html>
