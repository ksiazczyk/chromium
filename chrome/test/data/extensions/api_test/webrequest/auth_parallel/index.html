<html>
<body>
<script>
  const params = new URLSearchParams(location.search);

  const img1 = new Image();
  img1.src = params.get('img1');
  document.body.appendChild(img1);

  const img2 = new Image();
  img2.src = params.get('img2');
  document.body.appendChild(img2);
</script>
</body>
</html>
