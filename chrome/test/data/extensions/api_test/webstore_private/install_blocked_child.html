<!--docerion
type: test
title: Child account blocked install test
summary: Test page verifying that beginInstallWithManifest3 fails with blocked_for_child_account when a parent has not approved the extension.
-->

<script src="common.js"></script>
<script>

runTests([
  function installBlockedChild() {
    var manifest = getManifest();
    var expectedError =
        "Your parent didn't approve this extension"
    chrome.webstorePrivate.beginInstallWithManifest3(
        {id: appId, manifest: manifest},
        callbackFail(expectedError, function(result) {
      assertEq("blocked_for_child_account", result);
    }));
  },
]);

</script>
