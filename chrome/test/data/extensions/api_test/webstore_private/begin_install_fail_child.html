<!--docerion
type: test
title: Begin install failure test for child accounts
summary: Verifies that beginInstallWithManifest3 is blocked for child accounts and returns a blocked_for_child_account result.
-->

<script src="common.js"></script>
<script>

runTests([
  function beginInstall() {
    var manifest = getManifest();
    var expectedError =
        "Apps and extensions can only be modified by the manager ()."
    chrome.webstorePrivate.beginInstallWithManifest3(
        {id: extensionId, manifest: manifest},
        callbackFail(expectedError, function(result) {
      assertEq("blocked_for_child_account", result);
    }));
  },
]);

</script>
