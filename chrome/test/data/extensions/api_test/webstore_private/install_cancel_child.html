<!--docerion
type: test
title: Child account cancelled install test
summary: Test page verifying that a child account install returns user_cancelled when the user cancels the installation.
-->

<script src="common.js"></script>
<script>

runTests([
  function installCanceledChild() {
    var manifest = getManifest();
    chrome.webstorePrivate.beginInstallWithManifest3(
        {id: appId, manifest: manifest},
        function(result) {
      assertEq(result, "user_cancelled");
      succeed();
    });
  },
]);

</script>
