summary: Test HTML page that performs a JavaScript location.replace redirect to a PARAM_URL placeholder, used in Android Chrome redirect tests.

<html>
  <head>
    <script>
      function doRedirectReplace() {
        location.replace('PARAM_URL');
      }
    </script>
  </head>
  <body onLoad="setTimeout('doRedirectReplace()', 0);">
    This page will take you to "PARAM_URL" .
    <br>
    Relax and enjoy the ride.
  </body>
</html>
