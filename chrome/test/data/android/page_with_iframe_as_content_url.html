summary: Test HTML page that embeds an iframe loading a simple page from the Chrome test content provider and sets the document title from received messages.

<html>

<head>
    <script>
        onmessage = function(e) {
            document.title = e.data;
        }
    </script>
</head>

<body>
  <iframe id='iframe_test_id' src="content://org.chromium.chrome.test.TestContentProvider/simple_iframe.html" >
  </iframe>
</body>

</html>
