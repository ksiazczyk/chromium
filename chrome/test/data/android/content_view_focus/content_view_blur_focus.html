<!--docerion
type: test
title: Blur and focus test page
summary: HTML test page that sets its document title to 'blurred' or 'focused' on window blur and focus events, used as test data for Android ContentView focus tests.
-->

<html>
<head>
  <body>
    <script>
      window.onblur = function() { document.title='blurred' };
      window.onfocus = function() { document.title='focused' };
      document.title = 'initial';
    </script>
  </body>
</html>
