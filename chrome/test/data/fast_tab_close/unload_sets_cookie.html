<!--docerion
type: test
title: Fast tab close test page setting a cookie on unload
summary: HTML fixture that registers an unload listener setting an 'unloaded' cookie, letting tests verify unload handlers run on fast tab close.
-->

<html>
<head>
  <title>unload_sets_cookie</title>
<script>
addEventListener("unload", function() {
  var expires = new Date();
  expires.setMinutes(expires.getMinutes() + 1);
  document.cookie = "unloaded=ohyeah;path=/;expires=" + expires.toUTCString();
}, false);
</script>
</head>
<body></body>
</html>
