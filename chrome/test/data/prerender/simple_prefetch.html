type: test
title: Simple prefetch test page
summary: Test page that prefetches prefetch_target.lnk via a link element and updates the document title on load or error.
-->

<html>
<head>
<title>Simple Prefetch Page</title>
<script>
function linkOnload() {
  document.title = 'link onload';
}

function linkOnerror() {
  document.title = 'link onerror';
}
</script>
<link rel="prefetch"
      href="prefetch_target.lnk"
      onload="linkOnload()" 
      onerror="linkOnerror()"/>
</head>
<body>
</body>
</html>
