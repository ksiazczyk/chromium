<!--docerion
type: test
title: SAML API submit without confirm test page
summary: Test page that submits a fake SAML response form without sending a confirm call to the SAML API.
-->

<html>
  <head>
    <script type="text/javascript">
      function send_and_submit() {
        var form = document.forms[0];
        window.setTimeout(function() {
          form.submit();
        }, 0);
      }
    </script>
  </head>
  <body onload="send_and_submit();">
    <form method=post action="$Post">
      <input type=hidden name=SAMLResponse value="fake_response"/>
      <input type=hidden name=RelayState value="$RelayState">
    </form>
  </body>
</html>
