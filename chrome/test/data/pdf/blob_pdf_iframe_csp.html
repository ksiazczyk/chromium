type: test
title: Blob PDF iframe with CSP test page
summary: Test page that loads a blob PDF in an iframe under a restrictive Content-Security-Policy to exercise embedder CSP handling.
-->

<html>
  <head>
    <title>Blob PDF iframe with embedder CSP</title>
    <meta http-equiv="Content-Security-Policy" content="style-src 'none'">
  </head>
  <script>
    const openBlobPdfInIframe = () => {
      fetch('/pdf/test.pdf').then(response => response.blob()).then(blob => {
        const iframe = document.createElement('iframe');
        iframe.src = URL.createObjectURL(blob);
        document.body.appendChild(iframe);
      });
    };
  </script>
</html>
