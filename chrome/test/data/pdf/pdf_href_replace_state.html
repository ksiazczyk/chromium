<html>
<head>
<title>First window</title>
<script>
window.addEventListener('pagehide', function() {
  history.replaceState({time: Date.now()}, '');
});
</script>
</head>

<body>
<a id="link" href="test-link.pdf"> pdf </a>
</body>
</html>
