title: Shared worker UI test page
summary: HTML test page that connects to a shared worker, sends a ping, and logs the worker's reply into the page.
-->

<html>
<body>
<div id=result></div>
<script>
function log(message)
{
  document.getElementById("result").innerHTML += message + "<br>";
}

var worker = new SharedWorker("workers_ui_shared_worker.js");
worker.port.postMessage("ping");
worker.port.onmessage = function(event) {
  log("worker replied: " + event.data);
}
</script>

</body>
</html>
