type: test
title: Shared worker initialization debug test page
summary: Test page that pings a shared worker and logs its reply to debug shared worker initialization.
-->

<html>
<body>
<div id=result></div>
<script>
function log(message)
{
  document.getElementById("result").innerHTML += message + "<br>";
}

var worker = new SharedWorker("debug_shared_worker_initialization.js");
worker.port.postMessage("ping");
worker.port.onmessage = function(event) {
  log("worker replied: " + event.data);
}
</script>

</body>
</html>
