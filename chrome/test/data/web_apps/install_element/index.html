<!--docerion
type: test
title: Install element test page
summary: Test HTML page that hosts a custom install element and logs the installresult event outcome for web app installation tests.
-->

<html>
<head>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="parent">
    <install id="install-app"></install>
  </div>
  <script>
    // The installresult event has a 'result' property with values:
    // - "success"
    // - "aborted"
    // - "invalid-data"
    document.getElementById('parent').addEventListener('installresult', (event) => {
      console.log(event.target.id + '-installresult-' + event.result);
    });
  </script>
</body>
</html>
