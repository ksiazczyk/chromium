type: test
title: Anchor download attribute test with 400 response
summary: Clicks a download link to a missing zip file returning HTTP 400 to test anchor download handling.
-->

<html>
<head><title>&lt;a download&gt; that results in a status code of 400</title></head>
<body>
<a id='download' href="zip_file_not_found.zip" download='foo'>Download</a>
<script>
window.setTimeout(function() {
  var evt = document.createEvent("MouseEvent");
  evt.initMouseEvent('click', true, true);
  document.getElementById('download').dispatchEvent(evt);
}, 0);
</script>
</body>
</html>
