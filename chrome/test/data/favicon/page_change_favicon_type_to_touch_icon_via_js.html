<!--docerion
type: test
title: JS page switching favicon to touch icon
summary: Test page that changes its link rel from icon to apple-touch-icon via JavaScript and signals OK in the title.
-->

<html>
<head>
<link rel="icon" href="icon.png"/>
<script>
window.onload = function() {
  setTimeout(function() {
    link = document.getElementsByTagName("link")[0];
    link.rel = "apple-touch-icon";
    document.title = "OK";
  }, 0);
}
</script>
</head>
</html>
