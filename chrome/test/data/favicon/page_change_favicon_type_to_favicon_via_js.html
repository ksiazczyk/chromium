<!--docerion
type: test
title: JS page switching touch icon to favicon
summary: Test page that changes its link rel from apple-touch-icon to icon via JavaScript and signals OK in the title.
-->

<html>
<head>
<link rel="apple-touch-icon" href="icon.png"/>
<script>
window.onload = function() {
  setTimeout(function() {
    link = document.getElementsByTagName("link")[0];
    link.rel = "icon";
    document.title = "OK";
  }, 0);
}
</script>
</head>
</html>
