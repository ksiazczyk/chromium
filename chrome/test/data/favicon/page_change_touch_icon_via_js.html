<!--docerion
type: test
title: JS page changing touch icon URL
summary: Test page that rewrites its apple-touch-icon link href to icon2.png via JavaScript and signals OK in the title.
-->

<html>
<head>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" href="icon.png"/>
<script>
window.onload = function() {
  setTimeout(function() {
    link = document.getElementsByTagName("link")[0];
    link.href = "icon2.png";
    document.title = "OK";
  }, 0);
}
</script>
</head>
</html>
