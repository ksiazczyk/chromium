<!--docerion
type: test
title: Test page redirecting to a favicon page via location override
summary: Test fixture page that replaces its location with favicon/page_with_favicon.html after load, for testing favicon behavior across script-driven navigation.
-->

<html>
<head>
<script>
window.onload = function() {
  setTimeout(function() {
    this.document.location.replace("/favicon/page_with_favicon.html");
  }, 0);
}
</script>
</head>
</html>
