<!--docerion
type: test
title: Reporting observer test page
summary: Page that observes reports via ReportingObserver and stores the first report in window.result for chromedriver tests.
-->

<html>
  <script>
    window.result = "bad result";
    var observer = new ReportingObserver(function(reports) {
        window.result = reports[0];
    }, {buffered:true});
    observer.observe();
  </script>
</html>
