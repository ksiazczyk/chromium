<!--docerion
type: test
title: Test page detaching an iframe after form submission
summary: Test page that embeds a password reset iframe and removes it upon receiving a message, to test frame detachment after form submission.
-->

<html>
  <body>
    <iframe src="frame_detached_after_submit_iframe_form.html" title="Reset password" id="password_reset_iframe" name="password_reset_iframepassword_reset_iframe">
    </iframe>
    <script type="text/javascript">
      window.addEventListener("message", (event) => {
        var iframe = document.getElementById('password_reset_iframe');
        iframe.parentNode.removeChild(iframe);
      });
    </script>
  </body>
</html>
