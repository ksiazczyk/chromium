type: test
title: Error handling test page
summary: Test page that throws and catches an Error and writes its message into the page.
-->

<html>
    <p id="foo"></p>
    <script>
        try {
          throw new Error("A new Error");
        }
        catch(err) {
          document.getElementById("foo").innerHTML = err.message;
        }
    </script>
</html>
