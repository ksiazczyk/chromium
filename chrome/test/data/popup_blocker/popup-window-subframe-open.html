<html>
<head>
<title>Popup created using window.open</title>
<script>
function deleteframe() {
  var frame = document.getElementById('frame');
  frame.parentNode.removeChild(frame);
}
</script>
</head>
<body>
pop-up test page
<iframe id="frame" src="popup-subframe.html"></iframe>
</body>
</html>
