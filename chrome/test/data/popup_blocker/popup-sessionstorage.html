type: test
title: Check that the session storage namespace is not accessible to a blocked popup
summary: Test page that sets a sessionStorage item and opens check-sessionstorage.html to verify blocked popups cannot access session storage.
-->

<html>
<head>
<title>
  Check that the session storage namespace is not accessible to a blocked popup
</title>
<script>
function test() {
  sessionStorage.setItem("key", "set");
  window.open("check-sessionstorage.html");
}
</script>
</head>
<body onload="test()">
pop-up test page
</body>
</html>
