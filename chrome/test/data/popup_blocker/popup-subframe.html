<!--docerion
type: test
title: Popup created using window.open
summary: Subframe test page that opens a data URL popup via window.open and asks the parent page to delete the frame.
-->

<html>
<head>
<title>Popup created using window.open</title>
<script>
function test() {
  window.open("data:text/html,<title>Popup Success!</title>" +
  "you should not see this message if popup blocker is enabled",
  "mywindow", "menubar=1, resizable=1, width=350, height=250");
  window.parent.deleteframe();
}
</script>
</head>
<body onload="test()">
pop-up test page
</body>
</html>
