<!--docerion
type: test
title: Two popups created using window.open
summary: Test page that opens two popups, named mywindow and _blank, via window.open on load to exercise the popup blocker.
-->

<html>
<head>
<title>Popup created using window.open</title>
<script>
function popup(name) {
  window.open("popup-success.html",
  name, "menubar=1, resizable=1, width=350, height=250");
}

function test() {
  popup('mywindow');
  popup('_blank');
}
</script>
</head>
<body onload="test()">
pop-up test page
</body>
</html>
