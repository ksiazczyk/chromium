type: test
title: Popup opened on unload using window.open
summary: Test page that opens a popup via window.open in the body onunload handler to test popup blocking during page unload.
-->

<html>
<head>
<title>Popup created using window.open</title>
<script>
function popup() {
  window.open("popup-success.html",
  "_blank", "menubar=1, resizable=1, width=350, height=250");
}

</script>
</head>
<body onunload="popup()">
pop-up test page
</body>
</html>
