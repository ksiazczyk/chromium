type: test
title: History pushState after onload test page
summary: Test page that pushes a foo.html entry onto the browser history after the window loads.
-->

<html>
    <body>
        <script type="text/javascript">
         window.onload = function () {
             setTimeout(push);
         };

         function push() {
             window.history.pushState({}, "", "foo.html");
         }
        </script>
    </body>
</html>
