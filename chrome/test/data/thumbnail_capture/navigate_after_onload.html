summary: Test page that redirects the browser to redirect_target.html shortly after the window loads.
-->

<html>
    <body>
        <script type="text/javascript" >
         window.onload = function () {
             // Redirect after onload completes.
             setTimeout(redirect);
         };

         function redirect() {
             window.location.href = "redirect_target.html";
         }
        </script>
    </body>
</html>
