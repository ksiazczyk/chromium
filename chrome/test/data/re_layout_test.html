title: ReLayout resize event test page
summary: Test page that counts window resize events and logs body dimensions to verify relayout behavior.
-->

<html>

<head>
  <title>ReLayout test</title>
  <script>
    window.has_resized = false;
    window.resize_count = 0;
    window.addEventListener("resize", function (event) {
      window.has_resized = true;
      window.resize_count++;
      console.log(
        document.body.clientWidth + ', ' + document.body.clientHeight);
    })
  </script>
</head>

<body>
  This is a test page to test the resize event.
</body>

</html>
