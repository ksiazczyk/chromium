<!--docerion
type: test
title: Mojo JS interface broker test page Foo
summary: Test page that loads main.js, embeds a chrome-untrusted bar iframe, and exposes a promise that resolves once the iframe has loaded.
-->

<html>
<title>Bar</title>
<script src="/main.js" type="module"></script>
<iframe id="bar" src="chrome-untrusted://bar/"></iframe>
<script nonce="test">
// Browsertest needs to wait until bar is loaded before executing scripts in it.
window.barLoadedPromise = new Promise(resolve => {
  document.getElementById('bar').addEventListener('load', e => {
    resolve('loaded');
  });
})
</script>
</html>
