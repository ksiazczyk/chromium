type: test
title: Push state test page
summary: HTML test page that calls history.pushState on load and pushes a new URL when its button is clicked, for intent picker testing.
-->

<html>
<head>
<script>
window.onload = function() {
  history.pushState("", "");
}

function pushToNewUrl() {
	history.pushState("", "", "/newurl.html");
}
</script>
</head>

<body>
<button id="push_to_new_url_button" onclick="pushToNewUrl()">push to new url</button>
</body>
</html>
