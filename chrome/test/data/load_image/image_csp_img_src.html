type: test
title: CSP img-src self image test page
summary: Test page with an img-src 'self' content security policy that loads image.png into an img element after a delay.
-->

<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="img-src 'self'">
</head>
<img alt="long_placeholder_text"/>
<script src="common.js"></script>
<script>
window.onload = () => {
  setTimeout(() => {
    document.images[0].src = "image.png"
  }, 1000);
}
</script>
</html>
