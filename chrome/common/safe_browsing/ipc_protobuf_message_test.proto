// ---docerion
// type: test
// title: Test protobuf messages for IPC traits
// summary: Proto2 definitions of simple test messages used to exercise the IPC protobuf message traits macros.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

message SubMessage {
  optional int32 foo = 1;
}

message TestMessage {
  optional int32 fund_int = 1;
  optional string op_comp_string = 2;
  optional bytes op_comp_bytes = 3;
  optional SubMessage op_comp_sub = 4;
  repeated SubMessage rep_comp_sub = 5;
}
