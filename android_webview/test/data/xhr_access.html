<!--docerion
type: test
title: XHR access test page
summary: Test page that fetches hello_world.html via a synchronous XMLHttpRequest and writes the response or sets an exception title.
relations:
  - depends_on /android_webview/test/data/hello_world.html
-->

<html>
  <head>
    <script>
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "hello_world.html", false);
      try {
        xhr.send();
        document.write(xhr.responseText);
      } catch (e) {
        document.title = "Exception";
      }
    </script>
  </head>
  <body>
  </body>
</html>
