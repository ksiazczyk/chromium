<!--docerion
type: test
title: Image access test page
summary: Test page that loads chrome.png and reports the image's natural height in the document title for WebView image access tests.
relations:
  - references /android_webview/test/data/chrome.png
-->

<html>
  <head>
    <script>
      function updateTitle() {
        document.title = document.getElementById('img').naturalHeight;
      }
    </script>
  </head>
  <body onload="updateTitle()">
    <img id="img" onload="updateTitle()" src="chrome.png" />
  </body>
</html>
