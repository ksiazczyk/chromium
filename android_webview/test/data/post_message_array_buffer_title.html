type: test
title: Post message ArrayBuffer title test page
summary: Test page that decodes a received ArrayBuffer postMessage payload with TextDecoder and shows it in the document title.
-->

<html>

<head>
  <title>reply</title>
  <script>
    myObject.onmessage = function (event) {
      document.title = new TextDecoder().decode(event.data);
    };
    myObject.postMessage("Hello");
  </script>
</head>

<body>
  <div>post message waiting for reply</div>
</body>

</html>
