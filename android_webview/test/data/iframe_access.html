<!--docerion
type: test
title: Iframe access test page
summary: Test page that tries to read the location of an embedded hello_world.html iframe and reports the URL or an exception via the document title.
relations:
  - references /android_webview/test/data/hello_world.html
-->

<html>
  <head>
    <script>
      function onload() {
        try {
          document.title = document.getElementById("frame").contentWindow.location.href;
        } catch (e) {
          document.title = "Exception";
        }
      }
    </script>
  </head>
  <body onload="onload()">
    <iframe id="frame" src="hello_world.html"></iframe>
  </body>
</html>
