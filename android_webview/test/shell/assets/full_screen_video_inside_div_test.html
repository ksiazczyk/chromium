<!--docerion
type: test
title: Fullscreen video inside div test page
summary: Test page that plays a video inside a div and enters fullscreen, with element ids kept in sync with AwContentsClientFullScreenTest.
relations:
  - depends_on /android_webview/test/shell/assets/full_screen_video.js
  - depends_on /android_webview/test/shell/assets/video.webm

<html>
<head>
<script src="full_screen_video.js"></script>
</head>
<body>
<button id="fullscreenControl" autofocus style='padding:10px 10px;' onclick="goFullscreen('div'); return false">Go fullscreen</button>
<div id='div'>
    <button id="playControl" style='padding:10px 10px;' onclick="playVideo(); return false">Play</button>
    <video style = 'width: 300px; height: 300px;'  id='video'>
        <source src="video.webm" type="video/webm">
    </video>
</div>
</body>
</html>
