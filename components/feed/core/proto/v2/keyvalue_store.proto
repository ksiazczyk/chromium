// ---docerion
// type: source
// title: keyvalue_store.proto
// summary: Defines the feedkvstore proto with an Entry message holding a byte value and a modification timestamp for the feed's key/value store.
// ---

syntax = "proto3";

package feedkvstore;

option optimize_for = LITE_RUNTIME;

message Entry {
  bytes value = 1;
  // Unix timetamp in milliseconds.
  int64 modification_time = 2;
}
