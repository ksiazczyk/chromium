// ---docerion
// type: source
// title: Request schedule wire proto
// summary: Defines the RequestSchedule message specifying time-based refresh schedules for feed requests.
// ---

syntax = "proto2";

package feedwire;

import "components/feed/core/proto/v2/wire/duration.proto";

option optimize_for = LITE_RUNTIME;

message RequestSchedule {
  message TimeBasedSchedule {
    repeated Duration refresh_time_from_response_time = 1;
  }
  oneof schedule {
    TimeBasedSchedule time_based_schedule = 1;
  }
}
