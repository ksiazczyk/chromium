// ---docerion
// type: source
// title: Duration wire protobuf message
// summary: Defines the Duration protobuf message representing a time span in seconds and nanos.
// ---

syntax = "proto3";

package feedwire;

option optimize_for = LITE_RUNTIME;

message Duration {
  int64 seconds = 1;
  int32 nanos = 2;
}
