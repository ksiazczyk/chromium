// ---docerion
// type: source
// title: XSurface content wire proto
// summary: Defines the feedwire XSurfaceContent message holding XSurface output bytes together with an integer identifier.
// ---

syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message XSurfaceContent {
  optional bytes xsurface_output = 1;
  optional int32 id = 2;
}
