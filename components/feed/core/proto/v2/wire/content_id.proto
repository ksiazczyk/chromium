// ---docerion
// type: source
// title: Content ID wire proto
// summary: Defines the feedwire ContentId message identifying content by domain, type such as cluster or feature, and a fixed64 id.
// ---

syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message ContentId {
  enum Type {
    TYPE_UNDEFINED = 0;
    CLUSTER = 3;
    FEATURE = 4;
  }
  optional string content_domain = 1;
  optional int32 type = 2;
  optional fixed64 id = 3;
}
