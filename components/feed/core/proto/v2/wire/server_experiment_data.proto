// ---docerion
// type: source
// title: Server experiment data wire proto
// summary: Defines the ServerExperimentData message carrying namespaced server experiment identifiers.
// ---

syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message ServerExperimentData {
  message NamespacedExperimentInfo {
    optional string namespace = 1;
    repeated int32 experiment_id = 2 [packed = true];
  }
  repeated NamespacedExperimentInfo namespaced_experiment_info = 1;
}
