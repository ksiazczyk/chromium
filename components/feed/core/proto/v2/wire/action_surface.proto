syntax = "proto3";

package feedwire;

option optimize_for = LITE_RUNTIME;

enum ActionSurface {
  UNKNOWN_SURFACE = 0;
  ANDROID_CHROME_NEW_TAB = 7;
  IOS_CHROME_NEW_TAB = 8;
}
