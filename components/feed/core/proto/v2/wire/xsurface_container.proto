// ---docerion
// type: source
// title: XSurface container wire proto
// summary: Defines the feedwire XSurfaceContainer message wrapping opaque render data bytes for an XSurface container.
// ---

syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message XSurfaceContainer {
  optional bytes render_data = 1;
}
