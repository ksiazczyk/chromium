// ---docerion
// type: source
// title: RenderData protobuf definition
// summary: Defines the RenderData protobuf message describing render data types such as XSurface containers and prefetch resources.
// ---

syntax = "proto2";

package feedwire;

import "components/feed/core/proto/v2/wire/xsurface_container.proto";

option optimize_for = LITE_RUNTIME;

message RenderData {
  enum RenderDataType {
    UNKNOWN_RENDER_DATA_TYPE = 0;
    XSURFACE = 1;
    PREFETCH_RESOURCES = 2;
  }
  optional RenderDataType render_data_type = 1;
  optional XSurfaceContainer xsurface_container = 1000;
  optional bytes xsurface_prefetch_resources = 330939752;
}
