// ---docerion
// type: source
// title: Timestamp wire proto
// summary: Defines the Timestamp message representing a point in time as seconds and nanos.
// ---

syntax = "proto3";

package feedwire;

option optimize_for = LITE_RUNTIME;

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
