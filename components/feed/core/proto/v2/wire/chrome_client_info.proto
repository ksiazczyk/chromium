// ---docerion
// type: source
// title: ChromeClientInfo wire proto
// summary: Defines the ChromeClientInfo message carrying a session ID and start surface flag for Chrome feed clients.
// ---

syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message ChromeClientInfo {
  optional string session_id = 3;
  optional bool start_surface = 4;
}
