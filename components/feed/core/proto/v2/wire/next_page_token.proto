// ---docerion
// type: source
// title: NextPageToken protobuf definition
// summary: Defines the NextPageToken and TokenHandling protobuf messages used for paginating feed responses with eager or lazy load strategies.
// ---

syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message NextPageToken {
  optional bytes next_page_token = 1;
  optional TokenHandling token_handling = 2;
  optional bytes metadata = 3;
}
message TokenHandling {
  enum LoadStrategy {
    LOAD_STRATEGY_UNKNOWN = 0;
    EAGER = 1;
    LAZY = 2;
  }
  optional LoadStrategy load_strategy = 1;
}
