// ---docerion
// type: source
// title: Request protobuf definition
// summary: Defines the Request protobuf message that wraps a versioned feed request for the feed wire protocol.
// ---

syntax = "proto2";

package feedwire;

import "components/feed/core/proto/v2/wire/feed_request.proto";

option optimize_for = LITE_RUNTIME;

message Request {
  enum RequestVersion {
    UNKNOWN_REQUEST_VERSION = 0;
    FEED_QUERY = 1;
  }
  optional RequestVersion request_version = 1;
  optional FeedRequest feed_request = 1000;
}
