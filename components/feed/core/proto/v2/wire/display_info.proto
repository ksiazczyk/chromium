// ---docerion
// type: source
// title: DisplayInfo wire protobuf message
// summary: Defines the DisplayInfo protobuf message carrying screen density, width and height for the feed wire format.
// ---

syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message DisplayInfo {
  optional float screen_density = 1;
  optional uint32 screen_width_in_pixels = 2;
  optional uint32 screen_height_in_pixels = 3;
}
