// ---docerion
// type: source
// title: Diagnostic info wire proto
// summary: Defines the feedwire DiagnosticInfo message with actions remaining, last successful refresh time, and first app launch time fields.
// ---

syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message DiagnosticInfo {
  optional int32 actions_remaining = 1;
  optional int64 last_successful_refresh_time_usec = 2;
  optional int64 first_app_launch_ms_since_epoch = 3;
}
