// ---docerion
// type: source
// title: Persisted state DB content proto
// summary: Defines the PersistedStateContentProto message used for storing persisted state content with an original key and content data bytes.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package persisted_state_db;

// Used for storing PersistedState Content.
message PersistedStateContentProto {
  // Original key for data.
  optional string key = 1;

  // Content data.
  optional bytes content_data = 2;
}
