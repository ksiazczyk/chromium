// ---docerion
// type: source
// title: Tab context container access token protobuf
// summary: Defines the TabContextContainerAccessToken protobuf wrapping a name, encrypted container key and expiration time for tab context containers.
// ---

syntax = "proto2";

option java_multiple_files = true;
option java_package = "org.chromium.components.sync.protocol";

option optimize_for = LITE_RUNTIME;

package sync_pb;

import "google/protobuf/timestamp.proto";

// Access token wrapping an encrypted container key and key name.
message TabContextContainerAccessToken {
  optional string name = 1;
  optional bytes encrypted_container_key = 2;
  optional google.protobuf.Timestamp expire_time = 3;
}
