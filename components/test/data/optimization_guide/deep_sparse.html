type: test
title: Deep sparse fixed-position tree test page
summary: Test page that builds a deep DOM tree where only every other div is fixed-positioned.
-->

<html>
<body>Page with deep tree</body>
<script>
  var node = document.body;
  for(let i = 0; i < 202; i++) {
    node = node.appendChild(document.createElement('div'));
    if(i%2) node.style.position = 'fixed';
    node.appendChild(document.createTextNode('text'));
  }
</script>
</html>
