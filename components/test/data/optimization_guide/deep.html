<!--docerion
type: test
title: Deep fixed-position tree test page
summary: Test page that builds a 202-level deep DOM tree of fixed-position divs each containing text.
-->

<html>
<body>Page with deep tree</body>
<script>
  var node = document.body;
  for(let i = 0; i < 202; i++) {
    node = node.appendChild(document.createElement('div'));
    node.style.position = 'fixed';
    node.appendChild(document.createTextNode('text'));
  }
</script>
</html>
