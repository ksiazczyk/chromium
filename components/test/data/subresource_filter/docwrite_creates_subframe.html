<!--docerion
type: test
title: Test page writing a subframe into an iframe document
summary: Test fixture that uses document.write to rewrite a slow iframe's document and add a grandchild subframe.
-->

<html>
<body>
<iframe src="/slow?100" id="iframe"></iframe>
<script>
  // slow takes 100 seconds to load, plenty of time to overwrite the
  // provisional load.
  iframe = document.getElementById("iframe");
  let doc = iframe.contentDocument;

  doc.open();
  doc.write("<html><body>Rewritten. <iframe name='grandchild'></iframe></body></html>");
  doc.close();
</script>
</body>
</html>
