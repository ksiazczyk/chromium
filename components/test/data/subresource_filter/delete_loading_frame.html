<!--docerion
type: test
title: Test page deleting a loading iframe
summary: Test fixture that removes a slowly loading iframe, overwriting its provisional load, and signals completion via the document title.
-->

<html>
<body>
<iframe src="/slow?100" id="iframe"></iframe>
<script>
  // slow takes 100 seconds to load, plenty of time to overwrite the
  // provisional load.
  iframe = document.getElementById("iframe");
  iframe.parentElement.removeChild(iframe);
  document.title = "done";
</script>
</body>
</html>
