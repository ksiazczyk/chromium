<!--docerion
type: test
title: Test frame that inserts a script element dynamically
summary: Test HTML page that appends included_script.js to the head and resolves a promise reporting whether the script loaded.
-->

<html>
  <head>
  <script type="text/javascript">
     function insertScriptElementAndReportSuccess() {
       var s = document.createElement("script");
       s.type = "text/javascript"
       s.src = "included_script.js";
       return new Promise(resolve => {
        s.onload = () => { resolve(true); }
        s.onerror = () => { resolve(false); }
        document.head.appendChild(s);
       });
     }
  </script>
  </head>
</html>
