// ---docerion
// type: source
// title: Install attributes protobuf definition
// summary: Defines the SerializedInstallAttributes message used by cryptohome to persist name/value device install attributes.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package cryptohome;

message SerializedInstallAttributes {
  message Attribute {
    required string name = 1;
    required bytes value = 2;
  }
  // Specifies the version of the install attributes used to write the file.
  // Should be incremented when fallback behavior is needed.
  optional uint32 version = 1 [default = 1];
  repeated Attribute attributes = 2;
}
