# ---docerion
# type: config
# title: Quick unlock policy atomic groups
# summary: Groups the quick unlock policies into PinUnlock and QuickUnlock atomic groups.
# ---

PinUnlock:
  caption: Pin unlock
  policies:
  - PinUnlockMinimumLength
  - PinUnlockMaximumLength
  - PinUnlockWeakPinsAllowed
  - PinUnlockAutosubmitEnabled
QuickUnlock:
  caption: Quick unlock
  policies:
  - QuickUnlockModeAllowlist
  - QuickUnlockTimeout
