# ---docerion
# type: config
# title: Policy atomic groups for Signin policies
# summary: Groups related Signin policy definitions into atomic groups such as LoginScreenOrigins, SAML, and ProfileSeparation.
# ---

LoginScreenOrigins:
  caption: Login and screen origins
  policies:
  - DeviceLoginScreenIsolateOrigins
  - DeviceLoginScreenSitePerProcess
SAML:
  caption: SAML
  policies:
  - DeviceTransferSAMLCookies
ProfileSeparation:
  caption: Profile Separation
  policies:
  - ProfileSeparationSettings
  - ProfileSeparationDataMigrationSettings
  - ProfileSeparationDomainExceptionList
