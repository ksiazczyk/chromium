# ---docerion
# type: config
# title: Device status report upload frequency policy definition
# summary: Defines the policy setting how frequently device status report uploads are sent in milliseconds, with a minimum of 60 seconds and a default of 3 hours.
# ---

arc_support: This policy has no effect on the logging done by Android.
caption: Frequency of device status report uploads
desc: |-
  Setting the policy determines how frequently to send device status uploads, in milliseconds. The minimum allowed is 60 seconds.

        If not set, the default interval of 3 hours applies.
device_only: true
example_value: 10800000
features:
  dynamic_refresh: true
owners:
- cros-reporting-eng@google.com
- lbaraz@chromium.org
schema:
  minimum: 60000
  type: integer
supported_on:
- chrome_os:42-
tags:
- admin-sharing
type: int
generate_device_proto: False
