# ---docerion
# type: config
# title: Startup policy atomic groups
# summary: Declares atomic policy groups bundling the homepage-related policies and the RestoreOnStartup policies with captions and owners.
# ---

Homepage:
  caption: Homepage
  policies:
  - HomepageLocation
  - HomepageIsNewTabPage
  - NewTabPageLocation
  - ShowHomeButton
RestoreOnStartup:
  caption: Action on startup
  owners:
  - file://components/policy/OWNERS
  - rsorokin@chromium.org
  policies:
  - RestoreOnStartup
  - RestoreOnStartupURLs
