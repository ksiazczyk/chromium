# ---docerion
# type: config
# title: PluginVm atomic policy group
# summary: Groups the seven PluginVm policies together as a single atomic group named PluginVm.
# ---

PluginVm:
  caption: PluginVm
  policies:
  - PluginVmAllowed
  - PluginVmDataCollectionAllowed
  - PluginVmImage
  - PluginVmLicenseKey
  - PluginVmRequiredFreeDiskSpace
  - PluginVmUserId
  - UserPluginVmAllowed
