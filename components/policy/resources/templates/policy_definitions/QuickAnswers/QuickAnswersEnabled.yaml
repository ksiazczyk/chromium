# ---docerion
# type: config
# title: QuickAnswersEnabled policy definition
# summary: Defines the QuickAnswersEnabled boolean policy that controls whether Quick Answers may access selected content and send it to the server on Chrome OS.
# ---

caption: Enable Quick Answers
default: true
desc: |-
  This policy gives Quick Answers permission to access selected content and send the info to the server.

        If the policy is enabled, Quick Answers will be enabled.
        If the policy is disabled, Quick Answers will be disabled.
        If the policy is not set, users can decide whether to enable or disable Quick Answers.
example_value: true
features:
  dynamic_refresh: true
  per_profile: true
items:
- caption: Enable Quick Answers
  value: true
- caption: Disable Quick Answers
  value: false
owners:
- updowndota@google.com
schema:
  type: boolean
supported_on:
- chrome_os:97-
tags:
- google-sharing
type: main
