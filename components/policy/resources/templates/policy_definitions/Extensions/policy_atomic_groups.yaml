# ---docerion
# type: config
# title: Extensions policy atomic group
# summary: Groups the extension-related Chrome policies such as install allowlist, blocklist, forcelist and ExtensionSettings into one atomic group.
# ---

Extensions:
  caption: Extensions
  policies:
  - ExtensionInstallAllowlist
  - ExtensionInstallBlocklist
  - ExtensionInstallForcelist
  - ExtensionInstallSources
  - ExtensionAllowedTypes
  - ExtensionAllowInsecureUpdates
  - ExtensionSettings
  - ExtensionManifestV2Availability
  - ExtensionUnpublishedAvailability
  - ExtensionExtendedBackgroundLifetimeForPortConnectionsToUrls
  - ExtensionDOMActivityLoggingEnabled
  - ExtensionReviewPromptsEnabled
  - ExtensionForceInstallWithSearchOrNewTabOverridesEnabled
