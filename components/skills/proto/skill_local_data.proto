// ---docerion
// type: source
// title: Protobuf definition for local SKILL data storage
// summary: Defines the SkillLocalData message that wraps a sync SkillSpecifics payload as the on-disk local data for the SKILL data type.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package skills.proto;

import "components/sync/protocol/skill_specifics.proto";

// Local data stored on the disk for the `SKILL` data type.
message SkillLocalData {
  optional sync_pb.SkillSpecifics specifics = 1;
}
