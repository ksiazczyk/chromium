// ---docerion
// type: source
// title: 'request.proto: HTTP request params definitions'
// summary: Defines the RequestParams and RequestHeader messages that store HTTP request parameters such as URL, method, headers and credentials mode for a download.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package protodb;

message RequestHeader {
  optional string key = 1;
  optional string value = 2;
}

// Stores the HTTP request params associated with a download request.
message RequestParams {
  optional string url = 1;
  optional string method = 2;
  repeated RequestHeader headers = 3;
  optional bool fetch_error_body = 4;
  optional bool require_safety_checks = 5 [default = true];
  optional int32 credentials_mode = 6;  // network::mojom::CredentialsMode.
  optional int32 fetch_request_mode = 7;  // network::mojom::RequestMode.
}
