// ---docerion
// type: source
// title: TLS session protobuf messages
// summary: Defines the TlsSessionRequest and TlsSessionResponse messages carrying raw frame bytes for the private AI TLS service.
// ---

edition = "2023";

package private_ai.proto;

option optimize_for = LITE_RUNTIME;

// Request message for the TLS session.
message TlsSessionRequest {
  bytes frame = 1;
}

// Response message for the TLS session.
message TlsSessionResponse {
  bytes frame = 1;
}
