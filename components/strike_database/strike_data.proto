// ---docerion
// type: source
// title: Strike data protobuf definition
// summary: Protobuf definition of the StrikeData message storing the number of strikes and the timestamp of the last strike update for an entry.
// ---

syntax = "proto2";

package strike_database;

option optimize_for = LITE_RUNTIME;

message StrikeData {
  // Total number of strikes thus far.
  optional int32 num_strikes = 1;

  // Timestamp of when a strike was last added or removed
  // for this entry. Can be used to expire strikes later.
  optional int64 last_update_timestamp = 2;
}
