// ---docerion
// type: source
// title: Simple test proto message
// summary: Defines a TestMessage with a single optional string field, used as a simple test proto in the reporting component.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package reporting.test;

// A simple test proto with a string in it.
message TestMessage {
  optional string test = 1;
}
