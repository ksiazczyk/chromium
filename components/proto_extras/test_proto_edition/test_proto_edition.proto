// ---docerion
// type: source
// title: Test proto definitions using edition 2024
// summary: Defines protobuf messages for testing proto edition 2024 support, including a message with custom serialization enabled via proto_extras options.
// ---

edition = "2024";

option optimize_for = LITE_RUNTIME;

package proto_extras;

import option "components/proto_extras/proto_extras_options.proto";

message TestMessageEdition {
  string text = 1;
}

message CustomSerializedMessage {
  option (proto_extras_options).has_custom_serialization = true;

  int32 int_field = 1;
}

message CustomSerializedMessageEmbedder {
  CustomSerializedMessage message = 1;
}
