// ---docerion
// type: source
// title: Proto extras message options definition
// summary: Defines a protobuf message option extension that lets messages opt in to custom serialization.
// ---

import "google/protobuf/descriptor.proto";

package proto_extras;

message ProtoExtrasMessageOptions {
  optional bool has_custom_serialization = 1;
}

extend google.protobuf.MessageOptions {
  optional ProtoExtrasMessageOptions proto_extras_options = 85240;
}
