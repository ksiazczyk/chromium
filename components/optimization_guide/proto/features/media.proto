// ---docerion
// type: source
// title: Media data proto
// summary: Defines a Media message with a media type enum and raw bytes for image, audio, or video content.
// ---

syntax = "proto3";

package optimization_guide.proto;

option optimize_for = LITE_RUNTIME;

// Identifies the content type of some Media field.
enum MediaType {
  MEDIA_TYPE_UNKNOWN = 0;
}

// Data for images/audio/video.
message Media {
  MediaType media_type = 1;
  bytes content = 2;
}
