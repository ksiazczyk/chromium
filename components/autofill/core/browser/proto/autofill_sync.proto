// ---docerion
// type: source
// title: Autofill sync storage key protocol
// summary: Defines a protobuf message used to convert autofill key name-value pairs into sync storage keys for the AUTOFILL data type.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package autofill;

// Used to convert between autofill::AutofillKey and a std::string that can be
// passed to sync as storage key to uniquely identify an entity of DataType
// syncer::AUTOFILL.
message AutofillSyncStorageKey {
  optional string name = 1;
  optional string value = 2;
}
