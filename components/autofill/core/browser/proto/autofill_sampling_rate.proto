// ---docerion
// type: source
// title: Autofill UKM sampling rate protocol
// summary: Defines a protobuf message holding the per-origin sampling rate applied to Autofill UKM metrics recording.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package autofill;

message AutofillSamplingRate {
  // A sampling rate per origin based on origin popularity is applied to
  // Autofill UKM metrics recording.
  optional int32 sampling_rate = 1;
}
