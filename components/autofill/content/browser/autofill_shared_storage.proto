// ---docerion
// type: source
// title: Autofill shared storage protobuf messages
// summary: Defines protobuf messages describing autofill credit card data such as last four digits, network, and expiration for shared storage.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package autofill;

message AutofillCreditCardData {
  optional string last_four = 1;
  optional string network = 2;
  optional uint32 expiration_month = 3;
  optional uint32 expiration_year = 4;
}

message AutofillCreditCardList {
  repeated AutofillCreditCardData server_cards = 1;
}
