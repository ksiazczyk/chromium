// ---docerion
// type: source
// title: Site token provider proto definitions
// summary: Defines protobuf messages for site tokens and for generating platform site tokens in the site token provider component.
// ---

syntax = "proto3";

package site_token_provider.proto;

option optimize_for = LITE_RUNTIME;

message SiteToken {
  string domain = 1;
  string token = 2;
}

message GeneratePlatformSiteTokensRequest {
  string name = 1;
}

message GeneratePlatformSiteTokensResponse {
  repeated SiteToken site_tokens = 1;
}
