// ---docerion
// type: source
// title: Protobuf definition for phishing fuzzer cases
// summary: Defines the protobuf message describing fuzzer cases with a model memory region plus boolean and real feature lists.
// ---

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package safe_browsing;

message ClientSidePhishingFuzzerCase {
  optional bytes memory_region = 1;

  message RealFeature {
    optional bytes name = 1;
    optional float value = 2;
  }

  repeated RealFeature real_features = 2;
  repeated bytes boolean_features = 3;
}
