// ---docerion
// type: source
// title: Obtain token protobuf definitions
// summary: Proto2 schema defining ObtainTokenRequest and ObtainTokenResponse messages for the gapis component's token exchange.
// ---

syntax = "proto2";

package gapis_pb;

option java_multiple_files = true;
option java_package = "org.chromium.components.gapis.proto";
option optimize_for = LITE_RUNTIME;

message ObtainTokenRequest {
  optional string signed_challenge = 1;
}

message ObtainTokenResponse {
  optional string token = 1;
}
