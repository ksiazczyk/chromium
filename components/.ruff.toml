# ---docerion
# type: config
# title: Ruff configuration for //components
# summary: Configures Ruff lint and format settings for Python code under components, including line length, exclusions, quote style, and unfixable rules.
# ---

line-length = 80
indent-width = 4
extend-exclude = [
  "*_pb2.py",
  "feed/core/v2/tools/decode_feed_request.py",
  "test/data/autofill/merge/tools/*",
]

[format]
quote-style = "preserve"

[lint]
unfixable = ["F401"]
