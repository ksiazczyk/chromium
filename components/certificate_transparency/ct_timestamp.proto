// ---docerion
// type: source
// title: CTTimestamp protobuf definition
// summary: Defines the CTTimestamp protobuf message storing a timestamp as seconds and nanos for Certificate Transparency data.
// ---

syntax = "proto3";

package chrome_browser_certificate_transparency;

option optimize_for = LITE_RUNTIME;

message CTTimestamp {
  int64 seconds = 1;

  int32 nanos = 2;
}