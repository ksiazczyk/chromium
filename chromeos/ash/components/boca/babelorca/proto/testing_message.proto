// ---docerion
// type: test
// title: Testing message proto definitions
// summary: Defines a simple test-only protobuf message with integer and fixed-width fields used by the test support target.
// ---

syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package ash.babelorca;

message TestingMessage {
  int32 int_field = 1;
  fixed32 fixed32_field = 401;
  fixed64 fixed64_field = 402;
  int64 int64_field = 403;
}
