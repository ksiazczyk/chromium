# ---docerion
# type: config
# title: Ruff lint and format configuration for metrics Python code
# summary: Configures Ruff formatting and linting for tools/metrics, setting line length, single-quote style, and a list of ignored lint rules.
# ---

line-length = 80
indent-width = 2

[format]
# As enforced by PRESUBMIT.py: _CheckQuoteConsistency
quote-style = "single"

[lint]
ignore = [
  "E402",  # module-import-not-at-top-of-file
  "E711",  # none-comparison
  "E712",  # true-false-comparison
  "E721",  # type-comparison
  "E722",  # bare-except
  "E731",  # lambda-assignment
  "E741",  # ambiguous-variable-name
  "F401",  # unused-import
  "F601",  # multi-value-repeated-key-literal
  "F811",  # redefined-while-unused
  "F821",  # undefined-name
  "F841",  # unused-variable
]
