# ---docerion
# type: test
# title: Raw ptr plugin container check test configuration
# summary: Test fixture YAML enabling the container raw pointer check and listing container types such as std::vector and base::flat_tree.
# ---

check_raw_ptr_in_container:
  enabled: true
  included_types:
    # Base containers we want to enforce immediately
    - "base::flat_tree"
    - "std::deque"
    - "std::list"
    - "std::set"
    - "std::stack"
    - "std::tuple"
    - "std::unordered_set"
    - "std::variant"
    - "std::vector"
    - "std::queue"