// ---docerion
// type: source
// title: CPU time metric proto definition
// summary: Defines the CpuTimeMetric protobuf message with a CPU time percentage field, extending Perfetto TraceMetrics.
// ---

syntax = "proto2";

package perfetto.protos;

import "protos/perfetto/metrics/metrics.proto";
import "protos/perfetto/metrics/custom_options.proto";

message CpuTimeMetric {
  optional double cpu_time_percentage = 1 [(unit) = "n%_smallerIsBetter"];
}

extend TraceMetrics {
  optional CpuTimeMetric cpu_time_metric = 460;
}
