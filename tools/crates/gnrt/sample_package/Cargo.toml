# ---docerion
# type: config
# title: Cargo manifest for sample_package
# summary: Defines the sample Cargo package, its workspace members bar and foo, and dependencies used to exercise gnrt dependency resolution.
# ---

[package]
name = "sample_package"
version = "0.1.0"
edition = "2021"

[workspace]
members = [ "bar", "foo" ]

[dependencies]
baz = { package = "bar", path = "bar", version = "0.1" }
foo = { path = "foo" }
num-traits = "0.2"
once_cell = "1.12"
serde = { version = "1.0", features = ["derive"] }
termcolor = "1.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
more-asserts = "0.3"
