// ---docerion
// type: source
// title: Scheduled file protobuf definitions
// summary: Proto3 schema defining ScheduledFile messages with path, hash, and download timestamp fields plus a ScheduleFileList wrapper for auto-deletion of downloads.
// ---

syntax = "proto3";
package auto_deletion.proto;

option optimize_for = LITE_RUNTIME;

// All fields are required.
message ScheduledFile {
  string path = 1;
  string hash = 2;
  int64 download_timestamp = 3;
}

message ScheduleFileList {
  repeated ScheduledFile files = 1;
}
