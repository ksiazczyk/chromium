# ---docerion
# type: config
# title: Ruff configuration for iOS Python code
# summary: Sets line length, exclusions, and lint and format rules for Ruff when checking Python files under ios.
# ---

line-length = 80
indent-width = 4
extend-exclude = [
  "*_pb2.py",
  "third_party/*",
  "build/bots/scripts/xcode_log_parser.py",
  "tools/documents_statistics_viewer/cleanSandboxFileStats.py",
  "web_view/tools/build.py",
]

[lint]
unfixable = ["F401"]

[format]
quote-style = "preserve"
