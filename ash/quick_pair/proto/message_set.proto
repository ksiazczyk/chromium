// ---docerion
// type: source
// title: MessageSet protobuf definition
// summary: Proto2 MessageSet message with extension wire format that serves as the extensible base for messages such as FastPairInfo.
// ---

syntax = "proto2";
// option optimize_for = LITE_RUNTIME;
package proto2.bridge;

option java_outer_classname = "MessageSetProtos";
option java_multiple_files = true;
option cc_enable_arenas = true;

// This is proto2's version of MessageSet.
message MessageSet {
  option message_set_wire_format = true;

  extensions 4 to max;
}
