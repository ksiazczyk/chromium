# ---docerion
# type: config
# title: Ruff configuration for Python linting and formatting
# summary: Configures Ruff with an 80-character line length, two-space indentation, third_party exclusions, preserved quote style, and unfixable F401 lint.
# ---

line-length = 80
indent-width = 2
extend-exclude = ["third_party/*"]

[format]
quote-style = "preserve"

[lint]
unfixable = ["F401"]
