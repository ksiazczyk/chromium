# ---docerion
# type: config
# title: rewrapper_linux.cfg
# summary: Rewrapper configuration for Chromium's clang toolchain, setting the RBE container image, reproxy socket address, action labels, racing exec strategy, and dial and execution timeouts.
# ---

platform=container-image=docker://gcr.io/chops-public-images-prod/rbe/siso-chromium/linux@sha256:d7cb1ab14a0f20aa669c23f22c15a9dead761dcac19f43985bf9dd5f41fbef3a,label:action_default=1
server_address=unix:///tmp/reproxy.sock
labels=type=compile,compiler=clang,lang=cpp
exec_strategy=racing
dial_timeout=10m
exec_timeout=3m
reclient_timeout=4m
canonicalize_working_dir=true
