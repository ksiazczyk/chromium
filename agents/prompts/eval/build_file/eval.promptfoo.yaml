# ---docerion
# type: config
# title: Promptfoo evaluation config for build file task
# summary: Promptfoo evaluation that verifies the correct target is found and built for a given file, using a Gemini provider and Python assertions on generated object files.
# relations:
#   - depends_on /agents/testing/gemini_provider.py
# ---

description: >
  Verify that the correct target is found and built for
  the given file.
owner: dmurph@
prompts:
  - Can you build the file base/strings/strcat_unittest.cc locally?
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 1200
tests:
  - assert:
    - type: python
      value: file://../../../testing/asserts/check_changes.py:check_files_exist
      config:
        files:
        - out/Default/obj/base/base_unittests/strcat_unittest.o
    metadata:
      tags:
      - stable
