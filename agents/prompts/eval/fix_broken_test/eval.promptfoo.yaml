# ---docerion
# type: config
# title: Promptfoo evaluation config for fixing a broken test
# summary: Promptfoo configuration that applies the broken test patch, runs the fix_broken_test prompt through a Gemini provider, and asserts the DummyTest passes in blink_unittests.
# relations:
#   - references /agents/testing/gemini_provider.py
#   - references /agents/prompts/eval/fix_broken_test/broken_test.patch
#   - references /agents/prompts/eval/fix_broken_test/prompt.md
# ---

description: |
  Fix a broken DummyTest
prompts:
  - 'file://prompt.md'
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 1200
      changes:
        - apply: agents/prompts/eval/fix_broken_test/broken_test.patch
tests:
  - assert:
    - type: python
      value: file://../../../testing/asserts/check_gtests.py
      config:
        binary: blink_unittests
        filter: CSSCalculationValue.DummyTest
    metadata:
      tags:
      - stable
      precompile_targets:
      - blink_unittests
