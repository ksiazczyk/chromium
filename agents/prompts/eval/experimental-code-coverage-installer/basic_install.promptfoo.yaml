# ---docerion
# type: config
# title: Promptfoo eval for experimental-code-coverage-installer skill
# summary: Promptfoo evaluation config that runs a query against the experimental-code-coverage-installer skill via a Gemini provider and asserts the workspace setup is successfully verified.
# relations:
#   - depends_on /agents/testing/gemini_provider.py
# ---

description: Verify the experimental-code-coverage-installer skill correctly verifies the workspace setup.
owner: pasthana@
prompts:
  - "{{query}}"
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 300
      extensions: []
      skills:
        - experimental-code-coverage-installer
tests:
  - vars:
      query: "Verify that all code coverage related dependencies and code repositories are checked out on disk using the experimental-code-coverage-installer skill."
    assert:
      - type: contains
        value: "successfully verified and initialized"
