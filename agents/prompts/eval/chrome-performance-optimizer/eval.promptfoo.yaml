# ---docerion
# type: config
# title: Promptfoo eval config for chrome-performance-optimizer
# summary: Promptfoo evaluation configuration that verifies the chrome-performance-optimizer skill by running Speedometer 3 profile analysis queries through a Gemini provider and asserting use of analyze_profile.py.
# relations:
#   - depends_on /agents/testing/gemini_provider.py
# ---

description: Verify the chrome-performance-optimizer skill workflows and profile analysis.
owner: bikineev@chromium.org
prompts:
  - "{{query}}"
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 300
      skills:
        - chrome-performance-optimizer
tests:
  - vars:
      query: "Analyze this Speedometer 3 performance profile: http://pprof/?id=test_sp3_profile"
    assert:
      - type: contains
        value: "analyze_profile.py"
