# ---docerion
# type: config
# title: Promptfoo eval for Chromium build target queries
# summary: Promptfoo evaluation config that verifies the assistant names the correct Chromium build target, expecting viz_unittests for a given unittest source file.
# relations:
#   - depends_on /agents/testing/gemini_provider.py
# ---

description: Verify the correct build target is provided for a source file
owner: sshrimp@
prompts:
  - Which build target do I need to run in order to execute
    chromium/src/components/viz/common/frame_sinks/begin_frame_args_unittest.cc
    from the Chromium code base?
providers:
  - id: python:../../../testing/gemini_provider.py
    config:
      timeoutSeconds: 300
tests:
  - assert:
    - type: icontains
      value: viz_unittests
    metadata:
      tags:
      - stable
