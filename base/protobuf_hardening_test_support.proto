// ---docerion
// type: source
// title: Protobuf hardening test message definition
// summary: Proto2 definition of a message with repeated fields used to generate support code for the protobuf hardening tests.
// ---

syntax = "proto2";

package base.test;

option optimize_for = LITE_RUNTIME;

message HardeningTestMessage {
  message NestedMessage {}

  repeated int32 repeated_field = 1;
  repeated NestedMessage repeated_ptr_field = 2;
}
