type: test
title: Stepper timer test page
summary: Test page that increments a counter in a box every second via setTimeout, useful for timer and navigation tests.
-->

<html>
  <body>
  <div id="box"></div>
  <script>
    let timer_count = 0;
    function callback() {
      document.getElementById('box').textContent = timer_count++;
      window.setTimeout(callback, 1000);
    }
    callback();
  </script>
</body>
</html>
